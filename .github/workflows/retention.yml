# Daily 90-day deletion + keep-alive for Render free and Supabase free. Repo secrets: APP_URL, CRON_SECRET.
name: retention
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --retry 5 --retry-delay 20 --max-time 90 -X POST "${{ secrets.APP_URL }}/cron/retention" -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
